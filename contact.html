<!DOCTYPE html>
<html lang="en">
<head>
    <script src="favs.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact North Star Bakery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Links between pages!-->
<header> 

        <nav>
            <ul>
               <li><a href="index.html">Home</a></li>
               <li><a href="products.html">Products</a></li>
               <li><a href="about.html">About</a></li>
               <li><a href="contact.html">Contact</a></li>
           </ul>
        </nav>
        <!--Introduction of the page-->
    </header>

<main>
<h1>Contact us</h1>

<section>
    <h2>Visit us</h2>
    <p>North Star Bakery is located in the middle of our neighborhood making it a wonderful spot!</p>
    <p>Come stop for a treat from 8 am - 5pm Monday-Friday!</p>

</section>

<section>
    <h2>Submit a request!</h2>
    <!--Added id for form so javascript can interact-->
    <form id="contact-form">
        <!--Groups form stuff together-->
        <fieldset>
            <legend>Bakery questions/Pre ordering</legend>
            <!--labels to identify all of the form fields-->
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <p id="name-error"></p>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <p id="email-error"></p>

            <label for="pickup-date">Pickup Date:</label>
            <input type="date" id="pickup-date" name="pickup-date" required>

            <label for="request-type">Request Type:</label>
            <select id="request-type" name="request-type" required>
                <!--Options for the dropdown request type-->
                <option value="">Select your request type</option>
                <option value="Pre-order">Pre Order</option>
                <option value="Inquiry">Inquiry</option>
            </select>
            
            <label for="item-details">Explain your item details</label>
            <!--Defining text area so users can provide info-->
            <textarea id="item-details" name="item details" rows="5" cols="50" required></textarea>
            <p id="item-details-error"></p>

            
            <label for="allergies">Any allergies we should be aware of?</label>
            <textarea id="allergies" name="allergies" rows="5" cols="50"></textarea>
            <button type="submit">Submit Request</button>

        </fieldset>
    </form>
</section>
</main>

</body>
</html>
